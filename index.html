<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HardFit">
<meta name="theme-color" content="#17191c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<title>HardFit</title>
<style>
@font-face{font-family:'Archivo';src:url(fonts/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{
 --floor:#17191c;--s1:#1e2125;--s2:#262a2f;--s3:#30353b;--line:#2d3238;--line2:#3a4047;
 --chalk:#eceae4;--steel:#9aa1a9;--steel2:#6b737c;
 --red:#e0402f;--blue:#3a7bea;--yel:#f2c230;--grn:#34a865;--wht:#eceae4;
 --sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top);
 --wide:'Archivo',-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--floor);color:var(--chalk);font-family:'Archivo',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variation-settings:"wdth" 100}
body{padding-top:var(--st);overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
input,textarea,select{font:inherit;color:var(--chalk);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#view{padding:10px 18px calc(100px + var(--sb));max-width:560px;margin:0 auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* type */
.x{font-variation-settings:"wdth" 125;letter-spacing:-.01em}
.n{font-variation-settings:"wdth" 112;font-variant-numeric:tabular-nums}
h1{font-size:30px;line-height:1.08;margin:0;font-weight:800;font-variation-settings:"wdth" 118;letter-spacing:-.02em}
h2{font-size:21px;line-height:1.15;margin:0;font-weight:750;font-variation-settings:"wdth" 110;letter-spacing:-.01em}
h3{font-size:16.5px;margin:0;font-weight:700}
.lead{color:var(--steel);font-size:14.5px;margin-top:6px}
.small{font-size:13px}.tiny{font-size:11.5px}.mut{color:var(--steel)}.mut2{color:var(--steel2)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 10px}
.sec h3{font-size:15px;color:var(--steel);font-weight:600}
.sec button{color:var(--blue);font-weight:600;font-size:14px}

/* blocks */
.panel{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:10px}
.rows{background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:650}
.row .d{color:var(--steel);font-size:13px;margin-top:1px}
.chev{width:8px;height:8px;border-right:2px solid var(--steel2);border-top:2px solid var(--steel2);transform:rotate(45deg);flex:none;margin-right:4px}
.flex{display:flex;align-items:center;gap:10px}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:4px 9px;border-radius:99px;background:var(--s3);color:var(--chalk);white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:50%;display:inline-block}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 16px;border-radius:14px;background:var(--chalk);color:#141518;font-weight:750;font-size:16px;font-variation-settings:"wdth" 108}
.btn:active{transform:scale(.985)}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:var(--s2);color:var(--chalk);border:1px solid var(--line)}
.btn.sm{width:auto;padding:10px 14px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.txtbtn{color:var(--blue);font-weight:650;font-size:14.5px;padding:6px 0}
.icon{width:20px;height:20px;flex:none}
.ib{width:40px;height:40px;border-radius:12px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;flex:none}

/* top */
.top{display:flex;align-items:center;gap:12px;margin:6px 0 18px;min-height:40px}
.top h2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-variation-settings:"wdth" 125;font-size:17px;letter-spacing:.01em}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(23,25,28,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:7px 4px calc(7px + var(--sb))}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--steel2);padding:4px 0}
#tabs button svg{width:23px;height:23px}
#tabs button.on{color:var(--chalk)}
#tabs button.on svg{color:var(--chalk)}

/* readiness plate */
.plate{position:relative;width:176px;height:176px;flex:none}
.plate svg{width:100%;height:100%}
.plate .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.plate .c b{font-size:48px;font-weight:850;font-variation-settings:"wdth" 125;line-height:1;letter-spacing:-.03em}
.plate .c span{font-size:12px;color:var(--steel);margin-top:4px}

/* stats strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:16px;background:var(--s1);overflow:hidden}
.strip div{padding:12px 6px 10px;text-align:center;border-left:1px solid var(--line)}
.strip div:first-child{border-left:0}
.strip b{display:block;font-size:20px;font-weight:800;font-variation-settings:"wdth" 118;font-variant-numeric:tabular-nums}
.strip span{font-size:11.5px;color:var(--steel)}

/* week dots */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{font-size:11px;color:var(--steel2);font-weight:600}
.week .p{height:36px;border-radius:9px;background:var(--s2);margin-top:4px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--steel2)}
.week .p.on{background:var(--chalk);color:#141518}
.week .p.today{outline:1.5px solid var(--blue);outline-offset:1px}

/* scales */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.scale button{height:46px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-weight:750;font-size:16px;font-variation-settings:"wdth" 115;color:var(--steel)}
.scale button.on{color:#141518;border-color:transparent}
.ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--steel2);margin-top:6px}
.steps{display:flex;gap:6px;margin:4px 0 18px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--s3)}.steps i.on{background:var(--chalk)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 13px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--steel)}
.chip.on{background:var(--chalk);color:#141518;border-color:var(--chalk)}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px 8px;border-radius:9px;font-weight:650;font-size:14px;color:var(--steel)}
.seg button.on{background:var(--s3);color:var(--chalk)}

/* body map */
.bodymap{display:flex;justify-content:center;gap:8px}
.bodymap svg{width:100%;max-width:190px;height:auto}
.bodymap.mini svg{max-width:74px}
.rg{fill:#3a4047;stroke:var(--floor);stroke-width:1.2;transition:fill .15s}
.rg.tap{cursor:pointer}
.nb{fill:#2b3035;stroke:var(--floor);stroke-width:1.2}
.legend{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--steel);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}

/* session */
.exnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 12px;padding:0 18px}
.exnav::-webkit-scrollbar{display:none}
.exnav button{flex:none;min-width:34px;height:34px;border-radius:10px;background:var(--s2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--steel);padding:0 9px}
.exnav button.on{background:var(--chalk);color:#141518;border-color:var(--chalk)}
.exnav button.ok{border-color:var(--grn);color:var(--grn)}
.exhero{display:block}
.mus{display:flex;gap:14px;align-items:center;margin-top:12px;background:var(--s2);border-radius:14px;padding:10px 14px}
.mus .bodymap svg{width:54px;max-width:none}
.mus ul{list-style:none;margin:0;padding:0;font-size:13.5px;line-height:1.7}
.settbl{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.settbl td{padding:9px 6px;border-top:1px solid var(--line);color:var(--steel);font-variant-numeric:tabular-nums}
.settbl td:first-child{padding-left:0;color:var(--chalk);font-weight:600}
.settbl td:last-child{text-align:right;padding-right:0}
.settbl tr.cur td{color:var(--chalk)}
.settbl tr.cur td:first-child::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-left:8px;vertical-align:2px}
.settbl tr.done td{color:var(--steel2)}
.settbl tr.done td:first-child{color:var(--steel)}
.pl{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:9px;vertical-align:-1px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.28)}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.num{background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:10px 8px 8px;text-align:center}
.num label{font-size:12px;color:var(--steel);font-weight:600}
.num .ctl{display:flex;align-items:center;gap:4px}
.num input{background:none;border:0;padding:2px 0;text-align:center;font-size:34px;font-weight:850;font-variation-settings:"wdth" 120;min-width:0;font-variant-numeric:tabular-nums}
.num button{width:36px;height:36px;border-radius:11px;background:var(--s3);font-size:20px;font-weight:700;color:var(--chalk);flex:none}
.pse{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}
.pse button{height:36px;border-radius:9px;background:var(--s2);border:1px solid var(--line);font-size:13.5px;font-weight:650;color:var(--steel)}
.pse button.on{background:var(--chalk);color:#141518;border-color:var(--chalk)}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--s2);border-radius:14px;padding:11px 13px;font-size:13.5px;margin-top:12px}
.hint .sw{margin-top:5px}
.clock{font-weight:800;font-variation-settings:"wdth" 118;font-variant-numeric:tabular-nums;background:var(--s2);border:1px solid var(--line);padding:8px 11px;border-radius:11px;font-size:15px}
.clock.run{border-color:var(--blue)}

/* animação do exercício */
.mv.hero{width:100%;height:auto;display:block;background:#1e2125;border-radius:14px;aspect-ratio:4/3}
/* start bar */
.startbar{position:fixed;left:16px;right:16px;bottom:calc(78px + var(--sb));z-index:25;max-width:528px;margin:0 auto}
.startbar .btn{box-shadow:0 10px 30px rgba(0,0,0,.5)}
/* rest */
#rest{position:fixed;left:12px;right:12px;bottom:calc(80px + var(--sb));z-index:30;max-width:536px;margin:0 auto;background:var(--chalk);color:#141518;border-radius:18px;padding:12px 12px 12px 16px;display:none;align-items:center;gap:8px;box-shadow:0 14px 40px rgba(0,0,0,.55);overflow:hidden}
#rest.show{display:flex}
#rest .t{font-size:30px;font-weight:850;font-variation-settings:"wdth" 122;font-variant-numeric:tabular-nums;line-height:1}
#rest .l{font-size:12px;font-weight:650;color:#4a4f56}
#rest button{background:#d9d6cf;border-radius:10px;padding:9px 11px;font-weight:700;font-size:14px;color:#141518}
#rest button.go{background:#141518;color:var(--chalk)}
#restbar{position:absolute;left:0;bottom:0;height:4px;background:var(--blue)}

/* sheet */
#ov{position:fixed;inset:0;background:rgba(8,9,10,.62);z-index:61;display:none}
#ov.show{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:62;background:var(--s1);border-top:1px solid var(--line2);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + var(--sb));max-height:90vh;overflow:auto;transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);max-width:600px;margin:0 auto}
#sheet:not(.show){visibility:hidden;transition:transform .24s,visibility 0s .24s}
#sheet.show{transform:none}
#sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
.field{margin-bottom:14px}.field>label{display:block;font-size:13px;color:var(--steel);font-weight:600;margin-bottom:7px}

/* full-screen flow */
#flow{position:fixed;inset:0;z-index:60;background:var(--floor);display:none;flex-direction:column;padding-top:var(--st)}
#flow.show{display:flex}
#flow .fb{flex:1;overflow:auto;padding:8px 18px 20px}
#flow .ff{padding:12px 18px calc(12px + var(--sb));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--floor)}

/* media */
.media{width:100%;border-radius:14px;background:#000;display:block}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumbs img,.thumbs video{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--s2);display:block}
.drop{border:1.5px dashed var(--line2);border-radius:16px;padding:22px 16px;text-align:center;color:var(--steel);display:block;cursor:pointer}
.drop b{color:var(--chalk);display:block;margin-bottom:2px}

/* ai text */
.md{font-size:14.5px;line-height:1.6}
.md h4{font-size:15px;margin:14px 0 4px;font-weight:750}
.md ul{margin:4px 0;padding-left:18px}
.md p{margin:6px 0}
.ai{border-left:3px solid var(--blue);padding:2px 0 2px 13px}
.lab{width:100%;border-collapse:collapse;font-size:13.5px}
.lab td{padding:9px 4px;border-top:1px solid var(--line);vertical-align:top}
.lab td.v{text-align:right;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.bubble{padding:11px 14px;border-radius:16px;max-width:88%;margin-bottom:8px;font-size:14.5px;line-height:1.5}
.bubble.me{background:var(--blue);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.bubble.co{background:var(--s2);border-bottom-left-radius:5px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--s3);border-top-color:var(--chalk);animation:sp 0.8s linear infinite;display:inline-block;vertical-align:-4px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;top:calc(12px + var(--st));left:50%;transform:translateX(-50%);background:var(--chalk);color:#141518;padding:10px 16px;border-radius:12px;z-index:70;font-weight:650;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:90vw;text-align:center}
.bar{height:6px;border-radius:3px;background:var(--s3);overflow:hidden}.bar i{display:block;height:100%;border-radius:3px}
svg.chart{width:100%;height:150px;display:block}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--steel2)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--steel2)}
.sync.ok i{background:var(--grn)}.sync.wait i{background:var(--yel)}.sync.err i{background:var(--red)}
</style>
</head>
<body>
<div id="view"></div>
<div id="rest"><div id="restbar"></div><div><div class="l">Descanso</div><div class="t" id="restt">0:00</div></div><div style="flex:1"></div><button onclick="restAdd(-15)">−15</button><button onclick="restAdd(15)">+15</button><button class="go" onclick="restStop()">Pular</button></div>
<div id="ov" onclick="closeSheet()"></div>
<div id="sheet"><div class="grab"></div><div id="sheetc"></div></div>
<div id="flow"></div>
<nav id="tabs"></nav>
<script src="js/data.js"></script>
<script src="js/body.js"></script>
<script src="js/moves.js"></script>
<script src="js/store.js"></script>
<script src="js/run.js"></script>
<script src="js/cloud.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
<script src="js/perf.js"></script>
<script src="js/extra.js"></script>
</body>
</html>
